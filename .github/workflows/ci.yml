name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read

env:
  # Keep these exact revisions until compatible releases are registered.
  PARSERS_REV: e4adc5ba720e5668b726f65a574e2037c866d6df
  INLINESTRINGS_REV: ce4c3549691c4b3443cc14ffa90ebdd6636eff2f

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      JULIA_NUM_THREADS: 2
    strategy:
      fail-fast: false
      matrix:
        version: ['1']
        os: [ubuntu-latest, windows-latest]
        arch: [x64]
        include:
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
          - version: '1.10'
            os: ubuntu-latest
            arch: x86
          - version: '1'
            os: macos-latest
            arch: aarch64
          - version: '1'
            os: ubuntu-latest
            arch: x86
          - version: 'nightly'
            os: ubuntu-latest
            arch: x64

    steps:
      - name: Disable Git line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Install the reviewed dependency revisions
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.add([
              PackageSpec(
                  url="https://github.com/JuliaStrings/InlineStrings.jl.git",
                  rev=ENV["INLINESTRINGS_REV"],
              ),
              PackageSpec(
                  url="https://github.com/JuliaData/Parsers.jl.git",
                  rev=ENV["PARSERS_REV"],
              ),
          ])
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: lcov.info
          slug: ${{ github.repository }}
          use_oidc: true

  tables-scan:
    name: Tables.Scan integration (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      JULIA_NUM_THREADS: 2
      # Keep this immutable until a registered Tables.jl release contains Scan.
      TABLES_SCAN_REV: 6be83de366499e7a428ecea1f6adab1c4f8eeff0
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
      - name: Install the reviewed dependency revisions
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.add([
              PackageSpec(
                  url="https://github.com/JuliaData/Tables.jl.git",
                  rev=ENV["TABLES_SCAN_REV"],
              ),
              PackageSpec(
                  url="https://github.com/JuliaStrings/InlineStrings.jl.git",
                  rev=ENV["INLINESTRINGS_REV"],
              ),
              PackageSpec(
                  url="https://github.com/JuliaData/Parsers.jl.git",
                  rev=ENV["PARSERS_REV"],
              ),
          ])
          Pkg.instantiate()
      - name: Require the scan API
        shell: julia --color=yes --project=. {0}
        run: |
          using CSV
          isdefined(CSV.Tables, :Scan) ||
              error("the pinned Tables.jl revision does not define Tables.Scan")
          isdefined(CSV, :_executescanplan) ||
              error("CSV.jl did not load its Tables.Scan integration")
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: lcov.info
          flags: tables-scan
          slug: ${{ github.repository }}
          use_oidc: true

  quality:
    name: Package quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate the test environment
        shell: julia --color=yes --project=test {0}
        run: |
          using Pkg
          Pkg.add([
              PackageSpec(path=pwd()),
              PackageSpec(
                  url="https://github.com/JuliaStrings/InlineStrings.jl.git",
                  rev=ENV["INLINESTRINGS_REV"],
              ),
              PackageSpec(
                  url="https://github.com/JuliaData/Parsers.jl.git",
                  rev=ENV["PARSERS_REV"],
              ),
          ])
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - name: Run Aqua
        run: julia --color=yes --project=test test/quality.jl

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate the documentation environment
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.add([
              PackageSpec(path=pwd()),
              PackageSpec(
                  url="https://github.com/JuliaData/Parsers.jl.git",
                  rev=ENV["PARSERS_REV"],
              ),
          ])
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - name: Build strict documentation
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
