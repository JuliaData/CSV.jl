name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      performance_base:
        description: 'Base commit for an interleaved benchmark comparison; empty runs normal CI'
        required: false
        default: ''
        type: string
      performance_runner:
        description: 'Benchmark host'
        type: choice
        default: all
        options: [all, ubuntu-latest, windows-latest, ubuntu-24.04-arm, macos-15-intel]
      performance_filter:
        description: 'Optional public-surface case regex; nonempty skips the shape matrix'
        type: string
        default: ''
      performance_rounds:
        description: 'Alternating benchmark rounds'
        type: choice
        default: '2'
        options: ['2', '4']
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    if: inputs.performance_base == ''
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      JULIA_NUM_THREADS: 2
    strategy:
      fail-fast: false
      matrix:
        version: ['1']
        os: [ubuntu-latest, windows-latest]
        arch: [x64]
        include:
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
          - version: '1.10'
            os: ubuntu-latest
            arch: x86
          - version: '1'
            os: macos-latest
            arch: aarch64
          - version: '1.10'
            os: ubuntu-24.04-arm
            arch: aarch64
          - version: '1'
            os: ubuntu-24.04-arm
            arch: aarch64
          - version: '1'
            os: ubuntu-latest
            arch: x86
          - version: 'nightly'
            os: ubuntu-latest
            arch: x64
            allow_failure: true

    continue-on-error: ${{ matrix.allow_failure || false }}
    steps:
      - name: Disable Git line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        run: julia --color=yes --project=. test/dependencies.jl
      - uses: julia-actions/julia-buildpkg@v1
      - name: Check generic CPU compilation
        if: runner.os != 'Windows' && matrix.arch != 'x86' && matrix.version != 'nightly'
        run: julia --color=yes --compiled-modules=no --cpu-target=generic --project=. test/cpu.jl
      - uses: julia-actions/julia-runtest@v1
        continue-on-error: ${{ matrix.allow_failure || false }}
      - uses: julia-actions/julia-processcoverage@v1
        continue-on-error: ${{ matrix.allow_failure || false }}
      - uses: codecov/codecov-action@v7
        continue-on-error: ${{ matrix.allow_failure || false }}
        with:
          fail_ci_if_error: true
          files: lcov.info
          slug: ${{ github.repository }}
          use_oidc: true

  trim:
    if: inputs.performance_base == ''
    name: Trim compile and execute
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate trim environment
        run: julia --color=yes --project=test/trim test/dependencies.jl
      - name: Compile and execute the public writer
        run: julia --color=yes --project=test/trim test/trim/runtests.jl

  quality:
    if: inputs.performance_base == ''
    name: Package quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate the test environment
        run: julia --color=yes --project=test test/dependencies.jl
      - name: Run Aqua
        run: julia --color=yes --project=test test/quality.jl

  docs:
    if: inputs.performance_base == ''
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate the documentation environment
        run: julia --color=yes --project=docs test/dependencies.jl
      - name: Build strict documentation
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}

  performance:
    if: github.event_name == 'workflow_dispatch' && inputs.performance_base != ''
    name: Performance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.performance_runner == 'all' && fromJSON('["ubuntu-latest", "windows-latest", "ubuntu-24.04-arm", "macos-15-intel"]') || fromJSON(format('["{0}"]', inputs.performance_runner)) }}
    env:
      JULIA_NUM_THREADS: 4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.performance_base }}
          path: baseline
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Record revisions and CPU
        run: |
          mkdir results
          git -C baseline rev-parse HEAD > results/baseline-commit.txt
          git -C candidate rev-parse HEAD > results/candidate-commit.txt
          julia -e 'using InteractiveUtils; versioninfo(verbose=true); show(stdout, Sys.cpu_info()); println()' > results/host.txt
          if command -v lscpu >/dev/null; then lscpu >> results/host.txt; fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            sysctl machdep.cpu.brand_string machdep.cpu.features machdep.cpu.leaf7_features >> results/host.txt
          fi
      - name: Resolve the same released dependencies for both commits
        run: |
          julia --project=candidate/test candidate/test/dependencies.jl
          cp candidate/test/Project.toml baseline/test/Project.toml
          cp candidate/test/Manifest.toml baseline/test/Manifest.toml
          julia --project=baseline/test baseline/test/dependencies.jl
          cp candidate/test/Manifest.toml results/candidate-Manifest.toml
          cp baseline/test/Manifest.toml results/baseline-Manifest.toml
      - name: Record quote-mask machine code
        run: |
          for tree in baseline candidate; do
            julia --project="$tree/test" -e 'using CSV, InteractiveUtils; code_native(stdout, CSV.prefix_xor64, (UInt64,); debuginfo=:none)' > "results/$tree-prefix-native.txt"
          done
      - name: Compare package loading with direct source loading
        run: |
          for revision in baseline candidate; do
            CSV_MAC_PROBE_MODE=package_images julia --project="$revision/test" candidate/bench/mac_diagnose.jl "$PWD/baseline" "$PWD/candidate" "$PWD/results/$revision-package-images" > "results/$revision-package-images.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ matrix.os }}
          path: |
            results/
            candidate/bench/*.tsv
