name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      JULIA_NUM_THREADS: 2
    strategy:
      fail-fast: false
      matrix:
        version: ['1']
        os: [ubuntu-latest, windows-latest]
        arch: [x64]
        include:
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
          - version: '1.10'
            os: ubuntu-latest
            arch: x86
          - version: '1'
            os: macos-latest
            arch: aarch64
          - version: '1'
            os: ubuntu-latest
            arch: x86
          - version: 'nightly'
            os: ubuntu-latest
            arch: x64

    steps:
      - name: Disable Git line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Install release dependencies and pending review sources
        run: julia --color=yes --project=. test/dependencies.jl
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: lcov.info
          slug: ${{ github.repository }}
          use_oidc: true

  trim:
    name: Trim compile and execute
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate trim environment
        run: julia --color=yes --project=test/trim test/dependencies.jl
      - name: Compile and execute the public writer
        run: julia --color=yes --project=test/trim test/trim/runtests.jl

  quality:
    name: Package quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate the test environment
        run: julia --color=yes --project=test test/dependencies.jl
      - name: Run Aqua
        run: julia --color=yes --project=test test/quality.jl

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate the documentation environment
        run: julia --color=yes --project=docs test/dependencies.jl
      - name: Build strict documentation
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
