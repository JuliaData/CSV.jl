name: Bug report
description: Report incorrect CSV.jl behavior.
title: ""
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a reproducible CSV.jl problem.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: State what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest data and Julia code that reproduce the problem. Remove sensitive data.
      render: julia
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Include `versioninfo()` and `Pkg.status("CSV")` output.
      render: text
    validations:
      required: true
  - type: textarea
    id: problems
    attributes:
      label: Parse problems
      description: Include `CSV.problems(file)` when a read returns a table.
      render: text
  - type: dropdown
    id: threading
    attributes:
      label: Threading
      options:
        - Happens with ntasks=1 and multiple tasks
        - Happens only with multiple tasks
        - Happens only with ntasks=1
        - Not tested
    validations:
      required: true
