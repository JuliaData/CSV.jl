name: Feature request
description: Propose a focused CSV.jl capability or behavior change.
title: ""
labels: ["new feature"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the data and workflow that need this change.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest public behavior that solves the use case.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: List current workarounds or other designs that you considered.
